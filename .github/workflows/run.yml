name: Run Scrappers

on:
  repository_dispatch:
    types: [run_scrappers]

jobs:
  run:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        file: [scrapper39.js, scrapper40.js, scrapper41.js, scrapper42.js, scrapper43.js, scrapper44.js, scrapper45.js, scrapper46.js, scrapper47.js, scrapper48.js, scrapper49.js, scrapper50.js]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run Scraper
        run: node ${{ matrix.file }}
